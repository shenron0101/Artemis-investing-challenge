project:
  name: artemis_track1_data_collection
  timezone: UTC

universe:
  coins_markdown_path: ../Coins.md
  include_cohorts:
    - large_cap
    - mid_cap_strict
    - below_large_top100_ext

coingecko:
  per_page: 250
  max_pages: 8
  request_sleep_seconds: 1.2
  ids_batch_size: 150
  daily_lookback_days: 365    # free API hard-capped at 365 days

binance:
  quote_priority:
    - USDT
    - FDUSD
    - BUSD
    - USDC
  interval: 1d
  lookback_days: 1825          # 5 years — pipeline paginates in 1000-bar chunks
  kline_limit: 1000

artemis:
  request_sleep_seconds: 0.75
  symbols_batch_size: 40
  date_lookback_days: 1825    # 5 years
  metric_keywords:
    - transactions
    - real transactions
    - real             # permissive match for real_transactions / real_volume
    - volume
    - real volume
    - cumulative buyers
    - cumulative sellers
    - gamed transactions
    - gamed volume
    - gamed            # permissive match for gamed_*_pct metrics
    - avg transaction size
    - dau
    - active addresses
    - fees
    - revenue
    - active revenue
    - passive revenue
  # Artemis /data/{metrics}/?dimensionType=... does NOT currently return per-dimension
  # broken-down series for our universe — same flat shape as the non-dim call, with
  # 'Metric not available for asset.' sentinels on most pairs. Re-enable once the
  # correct endpoint/parameter is identified (see REMAINING.md P0 #2).
  dimension_types: []
  # dimension_types:
  #   - CHAIN
  #   - CATEGORY
  #   - PROTOCOL
  #   - VERSION
  # When true, run a one-shot diagnostic call against ETH that probes 4 candidate
  # by-chain endpoint/param variants and logs each response shape. Disabled by
  # default — flip to true to investigate, then flip back.
  debug_dimensions: false

defillama:
  enabled: true
  request_sleep_seconds: 0.4
  pull_raises: false      # requires paid DeFiLlama plan (402)
  pull_unlocks: false     # requires paid DeFiLlama plan (402)
  pull_stablecoins: true
  stablecoin_chains:
    - ethereum
    - solana
    - arbitrum
    - base
    - bsc
    - polygon
    - avalanche

storage:
  write_parquet: true
  write_csv: true
