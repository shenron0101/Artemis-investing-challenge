notes: |
  Manual mappings from CMC symbol to CoinGecko coin ID.
  Use this when the automatic symbol-based lookup in 01_fetch_coingecko.py
  fails to find a match or finds the wrong coin (e.g., common symbol collisions).
  Add entries here only for assets that appear in CMC rankings but cannot be
  automatically resolved to a CoinGecko ID.